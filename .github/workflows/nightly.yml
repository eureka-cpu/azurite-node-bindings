name: Nightly Azurite Update
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Run azurite update script
        run: nix run .#update-azurite
      - name: Check if update was applied
        id: check
        run: |
          if git diff --quiet nixos/overlays/azurite/info.json; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            version="$(jq -r .version nixos/overlays/azurite/info.json)"
            commit="$(jq -r .commitHash nixos/overlays/azurite/info.json | head -c7)"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "cargo_version=${version}" >> "$GITHUB_OUTPUT"
            echo "release_version=${version}-${commit}" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump Cargo.toml and regenerate Cargo.lock
        if: steps.check.outputs.has_update == 'true'
        run: |
          cargo_version="${{ steps.check.outputs.cargo_version }}"
          sed -i "s/^version = \".*\"/version = \"$cargo_version\"/" Cargo.toml
          nix develop --command cargo update -p azurite-node-bindings
      - name: Run flake checks
        if: steps.check.outputs.has_update == 'true'
        run: nix flake check
      - name: Configure git
        if: steps.check.outputs.has_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Commit and tag
        if: steps.check.outputs.has_update == 'true'
        run: |
          release_version="${{ steps.check.outputs.release_version }}"
          git add nixos/overlays/azurite/info.json
          git add nixos/overlays/azurite/package-lock.json
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump azurite to $release_version"
          git tag "v$release_version"
          git push origin HEAD "v$release_version"
      - name: Check if GitHub release exists
        id: gh_release
        run: |
          version="$(jq -r .version nixos/overlays/azurite/info.json)"
          commit="$(jq -r .commitHash nixos/overlays/azurite/info.json | head -c7)"
          release_version="${version}-${commit}"
          if gh release view "v$release_version" > /dev/null 2>&1; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release
        if: steps.gh_release.outputs.already_released == 'false'
        run: gh release create "v${{ steps.gh_release.outputs.release_version }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if version exists on crates.io
        id: crate
        run: |
          cargo_version="$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "User-Agent: azurite-node-bindings CI" \
            "https://crates.io/api/v1/crates/azurite-node-bindings/$cargo_version")
          if [ "$status" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to crates.io
        if: steps.crate.outputs.already_published == 'false'
        run: nix develop --command cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
