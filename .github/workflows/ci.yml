name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix flake check
      - run: nix flake check ./nixos/examples/azurite-blob --override-input azurite-node-bindings .
